<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AttendSync</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-sizing: border-box;
        }

        #status {
            margin-top: 15px;
            font-size: 13px;
        }


        #preview[hidden] {
            display: none;
        }

        #previewTable {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        #previewTable th,
        #previewTable td {
            padding: 8px 4px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        #cancelFill {
            background-color: #64748b;
        }
    </style>
</head>

<body>
    <h2>AttendSync</h2>
    <p>Smart Attendance Automation</p>

    <button id="extract">Extract Attendance</button>
    <button id="fill">Fill GPA Attendance</button>

    <p id="status">Ready to begin.</p>
    <div id="preview" hidden>
        <h3>Attendance Preview</h3>

        <p id="previewSummary"></p>

        <div style="max-height: 220px; overflow-y: auto;">
            <table id="previewTable">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Attendance</th>
                        <th>GPA Band</th>
                    </tr>
                </thead>
                <tbody id="previewBody"></tbody>
            </table>
        </div>

        <button id="confirmFill">Confirm & Fill</button>
        <button id="cancelFill" type="button">Cancel</button>
    </div>

    <script src="popup.js"></script>
</body>

</html>
