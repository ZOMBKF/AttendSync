<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendSync</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        p {
            color: #64748b;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #status {
            font-size: 13px;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <h1>AttendSync</h1>
    <p>Smart Attendance Automation</p>

    <button id="extract">Extract Attendance</button>
    <button id="fill">Fill GPA Attendance</button>

    <p id="status">Ready to begin.</p>

    <script src="popup.js"></script>
</body>

</html>
