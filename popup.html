<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AttendSync</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-sizing: border-box;
        }

        #status {
            margin-top: 15px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <h2>AttendSync</h2>
    <p>Smart Attendance Automation</p>

    <button id="extract">Extract Attendance</button>
    <button id="fill">Fill GPA Attendance</button>

    <p id="status">Ready to begin.</p>

    <script src="popup.js"></script>
</body>

</html>
